<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Meeting Minutes Generator</title>
<style>
:root{--bg:#f5f6f8;--sf:#fff;--tx:#1c2230;--mu:#667085;--bd:#d8dce4;--ac:#1f5fae;--ok:#1a7f4b;--wr:#b42318;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--sf:#1b2029;--tx:#e8ebf1;--mu:#98a2b3;--bd:#323946;--ac:#6ea8ee;--ok:#4cc38a;--wr:#f97066;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151b;--sf:#1b2029;--tx:#e8ebf1;--mu:#98a2b3;--bd:#323946;--ac:#6ea8ee;--ok:#4cc38a;--wr:#f97066;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{font-size:18px;margin:0}#ss{color:var(--mu);font-size:12px;margin-left:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;border:0;padding:7px 11px;border-radius:6px;color:var(--mu);cursor:pointer;font:inherit}nav button.on{background:var(--ac);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kp div{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px}.kp b{display:block;font-size:26px}.kp span{color:var(--mu);font-size:12px}
button,select,input,textarea{font:inherit;color:inherit}
.b{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer}.b.s{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}.b.d{background:var(--wr)}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:7px;width:100%;font-size:14px;color:var(--tx)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.g .w{grid-column:1/-1}
.row{border:1px solid var(--bd);border-radius:8px;padding:10px;margin:8px 0;position:relative}.row>b{font-size:12px;color:var(--mu)}.row .x{position:absolute;right:6px;top:6px;background:none;border:0;color:var(--wr);cursor:pointer}
details{background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-bottom:12px}summary{padding:12px 14px;font-weight:600;cursor:pointer}details>div{padding:0 14px 14px}
h3{font-size:14px;margin:12px 0 4px;display:flex;gap:8px;align-items:center}
.quick .opt{display:none}
table.t{width:100%;border-collapse:collapse;font-size:13px}.t th,.t td{text-align:left;padding:7px;border-bottom:1px solid var(--bd);vertical-align:top}.t th{color:var(--mu);font-weight:600}
.sc{overflow-x:auto}.tag{padding:2px 8px;border-radius:99px;font-size:11px;border:1px solid var(--bd)}.tag.ok{color:var(--ok)}.tag.wr{color:var(--wr)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.bar input,.bar select{width:auto}
#pv{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}#pv.on{display:flex;flex-direction:column}
#pv .bar{background:var(--sf);margin:0;padding:8px 12px}#pv iframe{flex:1;border:0;background:#fff}
#msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:8px;display:none;z-index:30;max-width:90%}
</style></head><body>
<header><h1>Meeting Minutes Generator</h1><nav id="nv"></nav><span id="ss">Ready</span><span id="st" style="color:var(--mu);font-size:12px"></span></header>
<main id="mn"></main>
<div id="pv"><div class="bar"><button class="b" id="pp">Print / Save as PDF</button><button class="b s" id="pw">Download Word (.docx)</button><button class="b s" id="pc">Close</button></div><iframe id="pf" title="Preview" sandbox="allow-same-origin allow-modals"></iframe></div>
<div id="msg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TYPES=['General Meeting','Project Coordination Meeting','Construction Progress Meeting','Preconstruction Meeting','Site Meeting','Technical Meeting','Safety Meeting','Design Review Meeting','Contract Administration Meeting','Deficiency Review Meeting','Closeout Meeting','Stakeholder Meeting','Other / Custom Meeting'],
FMT=['In-Person','Online','Hybrid'],PRI=['Low','Medium','High','Critical'],AST=['Not Started','In Progress','Pending','Completed','On Hold','Overdue'],ATT=['Present','Absent','Regrets','Optional'];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let S={m:[],tpl:[],ppl:[],set:{title:'Meeting Minutes',hdr:'',ftr:'',name:'MeetingMinutes_{project}_{title}_{date}'}},cur=null,tab='dash',quick=false,q='',sel={},dl=null,tm;
try{const r=localStorage.getItem('mmg');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('mmg',JSON.stringify(S));$('#ss').textContent='Saved '+new Date().toLocaleTimeString();usage()}catch(e){$('#ss').textContent='Not saved (browser storage unavailable)'}};
const msg=t=>{const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(tm);tm=setTimeout(()=>m.style.display='none',3500)};
const blank=()=>({id:'m'+Date.now()+Math.random().toString(36).slice(2,5),title:'',subject:'',projNo:'',type:TYPES[0],ref:'MM-'+new Date().getFullYear()+'-'+String(S.m.length+1).padStart(3,'0'),date:today(),start:'',end:'',loc:'',fmt:'In-Person',chair:'',by:'',rev:'',dist:'',nd:'',nt:'',nl:'',status:'Draft',reviewed:false,att:[],ag:[],dec:[],act:[],iss:{out:'',clar:'',appr:'',risk:'',fol:'',nag:''},notes:''});
const ROW={att:()=>({n:'',o:'',r:'',e:'',s:'Present',rem:''}),ag:()=>({t:'',d:'',i:'',dec:'',act:'',who:'',due:'',rem:''}),dec:()=>({t:'',k:'Confirmed'}),act:()=>({d:'',who:'',org:'',asg:today(),due:'',pri:'Medium',st:'Not Started',done:'',rem:''})};
const FL={att:[['Name','n'],['Organization','o'],['Role','r'],['Email','e','email'],['Attendance','s','sel',ATT],['Remarks','rem']],
ag:[['Topic','t'],['Discussion summary','d','ta'],['Issues / concerns','i','ta'],['Decision / resolution','dec','ta'],['Required action','act'],['Responsible','who'],['Due date','due','date'],['Remarks','rem']],
dec:[['Decision / resolution','t','ta'],['Type','k','sel',['Confirmed','Suggested / Unresolved']]],
act:[['Action description','d','ta'],['Responsible','who'],['Organization','org'],['Assigned','asg','date'],['Due date','due','date'],['Priority','pri','sel',PRI],['Status','st','sel',AST],['Completed on','done','date'],['Remarks','rem']]};
const OPT={att:['e','rem'],ag:['i','act','who','due','rem'],act:['org','asg','done','rem']};
const gp=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o),sp=(o,p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((a,x)=>a[x],o)[l]=v};
const F=(p,l,t='text',op,c='')=>{const v=gp(cur,p)??'';return `<label class="${c}">${l}`+(t=='sel'?`<select data-p="${p}">${op.map(x=>`<option${x==v?' selected':''}>${esc(x)}</option>`).join('')}</select>`:t=='ta'?`<textarea data-p="${p}" rows="2">${esc(v)}</textarea>`:`<input type="${t}" data-p="${p}" value="${esc(v)}">`)+'</label>'};
const LST=(k,t)=>`<h3>${t} <button class="b s" data-add="${k}">+ Add</button></h3>`+cur[k].map((r,i)=>`<div class="row"><b>#${i+1}</b><button class="x" data-rm="${k}.${i}" title="Remove">✕</button><div class="g">${FL[k].map(f=>F(`${k}.${i}.${f[1]}`,f[0],f[2]||'text',f[3],(OPT[k]||[]).includes(f[1])?'opt':(f[2]=='ta'?'w':''))).join('')}</div></div>`).join('');
const est=a=>a.st!='Completed'&&a.due&&a.due<today()?'Overdue':a.st;
const allAct=()=>S.m.flatMap(m=>m.act.map(a=>({m,a})));
const dt=d=>d?new Date(d+'T00:00').toLocaleDateString('en-CA',{year:'numeric',month:'long',day:'numeric'}):'—';
const T=(h,r)=>r.length?`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${esc(c)||'—'}</td>`).join('')}</tr>`).join('')}</table>`:'<p><i>None recorded.</i></p>';
const P=s=>s?esc(s).replace(/\n/g,'<br>'):'<i>None recorded.</i>';
function body(m){const s=S.set,i=m.iss;return `<div class="h">${s.hdr?`<div class="lh">${esc(s.hdr)}</div>`:''}<h1>${esc(s.title||'Meeting Minutes')}</h1><h2>${esc(m.title||'Untitled meeting')}</h2><p>${esc(m.subject)}${m.projNo?' — Project No. '+esc(m.projNo):''}</p></div>
<h3>1. Meeting Information</h3>${T(['Item','Detail'],[['Meeting type',m.type],['Reference',m.ref],['Date',dt(m.date)],['Time',(m.start||'—')+' to '+(m.end||'—')],['Location / format',(m.loc||'—')+' ('+m.fmt+')'],['Chair / facilitator',m.chair],['Distribution date',dt(m.dist)]])}
<h3>2. Attendance and Distribution</h3>${T(['Name','Organization','Role','Email','Attendance','Remarks'],m.att.map(a=>[a.n,a.o,a.r,a.e,a.s,a.rem]))}
<h3>3. Agenda</h3>${T(['No.','Topic'],m.ag.map((a,k)=>[k+1,a.t]))}
<h3>4. Discussion Summary</h3>${m.ag.length?m.ag.map((a,k)=>`<p><b>${k+1}. ${esc(a.t)||'Untitled item'}</b><br>${P(a.d)}${a.i?'<br><i>Issues / concerns:</i> '+P(a.i):''}${a.dec?'<br><i>Decision:</i> '+P(a.dec):''}${a.act?'<br><i>Action:</i> '+esc(a.act)+' — '+esc(a.who||'[Responsible TBC]')+(a.due?' — due '+dt(a.due):''):''}</p>`).join(''):'<p><i>None recorded.</i></p>'}
<h3>5. Decisions and Resolutions</h3>${T(['No.','Decision / resolution','Status'],m.dec.map((d,k)=>[k+1,d.t,d.k]))}
<h3>6. Action Items</h3>${T(['No.','Action','Responsible','Organization','Due','Priority','Status'],m.act.map((a,k)=>[k+1,a.d,a.who,a.org,dt(a.due),a.pri,est(a)]))}
<h3>7. Outstanding Issues</h3><p>${P(i.out)}</p><p><b>Items requiring clarification:</b><br>${P(i.clar)}</p><p><b>Pending approvals:</b><br>${P(i.appr)}</p><p><b>Risks and concerns:</b><br>${P(i.risk)}</p>
<h3>8. Follow-Up Requirements</h3><p>${P(i.fol)}</p>
<h3>9. Next Meeting</h3><p>${m.nd?dt(m.nd)+' '+esc(m.nt)+' — '+esc(m.nl):'<i>To be confirmed.</i>'}</p><p><b>Proposed agenda:</b><br>${P(i.nag)}</p>
<h3>10. Prepared By / Reviewed By</h3>${T(['Prepared by','Reviewed by'],[[m.by,m.rev]])}${S.set.ftr?`<p class="ft">${esc(S.set.ftr)}</p>`:''}`}
const CSS='body{font:11pt Calibri,Arial,sans-serif;color:#111}h1{font-size:20pt;margin:0}h2{font-size:14pt;margin:4px 0;color:#1f4e8c}h3{font-size:12pt;border-bottom:1px solid #999;margin:16px 0 6px;color:#1f4e8c}table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:4px 6px;font-size:10pt;text-align:left;vertical-align:top}th{background:#e8edf4}.ft{font-size:9pt;color:#555;text-align:center}.lh{font-size:10pt;color:#555;white-space:pre-line}@page{margin:20mm;@bottom-center{content:"Page " counter(page)}}.pb{page-break-before:always}';
const full=ms=>`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Minutes</title><style>${CSS}</style></head><body>${ms.map((m,i)=>`<div${i?' class="pb"':''}>${body(m)}</div>`).join('')}</body></html>`;
const fname=(m,e)=>{const c=x=>String(x||'').trim().replace(/[^\w\-]+/g,'_').replace(/^_|_$/g,'')||'NA';return S.set.name.replace('{project}',c(m.subject||m.projNo)).replace('{title}',c(m.title)).replace('{date}',m.date||'').replace('{ref}',c(m.ref))+e};
async function docx(ms){const z=new JSZip(),W='http://schemas.openxmlformats.org/',R=W+'officeDocument/2006/relationships';
z.file('[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="${W}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="html" ContentType="text/html"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
z.file('_rels/.rels',`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="${W}package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="word/document.xml"/></Relationships>`);
z.file('word/document.xml',`<?xml version="1.0" encoding="UTF-8"?><w:document xmlns:w="${W}wordprocessingml/2006/main" xmlns:r="${R}"><w:body><w:altChunk r:id="rId1"/></w:body></w:document>`);
z.file('word/_rels/document.xml.rels',`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="${W}package/2006/relationships"><Relationship Id="rId1" Type="${R}/aFChunk" Target="afchunk.html"/></Relationships>`);
z.file('word/afchunk.html',full(ms));return z.generateAsync({type:'blob'})}
async function out(name,data){try{dl=dl||await claude.use('downloads')}catch(e){}if(!dl){msg('Downloads are unavailable in this view. Use Print / Save as PDF instead.');return}
try{await dl.save({filename:name,data});}catch(e){if(e&&e.code!='declined')msg('Save failed: '+(e.message||e.code))}}
const one=m=>docx([m]).then(b=>out(fname(m,'.docx'),b));
let pvm=[];function prev(ms){pvm=ms;$('#pf').srcdoc=full(ms);$('#pv').classList.add('on')}
$('#pc').onclick=()=>$('#pv').classList.remove('on');$('#pp').onclick=()=>{try{$('#pf').contentWindow.focus();$('#pf').contentWindow.print()}catch(e){msg('Printing is blocked in this view.')}};
$('#pw').onclick=async()=>{if(pvm.length==1)one(pvm[0]);else out('MeetingMinutes_Combined.docx',await docx(pvm))};
// quick notes parser
function parseNotes(t){const m=cur,L=t.split(/\n/).map(x=>x.trim()).filter(Boolean);let ag=null,n=0;
const who=s=>{let w='',d='';s=s.replace(/@([\w .'-]+?)(?=\s+(?:by|due)\b|[,.;]|$)/i,(a,b)=>{w=b.trim();return ''}).replace(/\((?:resp(?:onsible)?:?\s*)?([A-Z][\w .'-]+)\)/,(a,b)=>{w=b.trim();return ''}).replace(/\b(?:due|by)\s+(\d{4}-\d{2}-\d{2})/i,(a,b)=>{d=b;return ''});return[s.replace(/\s+/g,' ').replace(/[\s,;-]+$/,''),w,d]};
const out=m.iss;L.forEach(l=>{let r;
if(r=l.match(/^(?:action(?: item)?|todo|ai)\s*[:\-]\s*(.*)/i)){const[d,w,du]=who(r[1]);m.act.push(Object.assign(ROW.act(),{d,who:w||'[Responsible TBC]',due:du}));n++}
else if(r=l.match(/^(?:decision|decided|agreed|approved|resolved)\s*[:\-]\s*(.*)/i)){m.dec.push({t:r[1],k:'Confirmed'});n++}
else if(r=l.match(/^(?:suggest(?:ion)?|proposal|proposed)\s*[:\-]\s*(.*)/i)){m.dec.push({t:r[1],k:'Suggested / Unresolved'});n++}
else if(r=l.match(/^(?:issue|concern|risk|open item|outstanding)\s*[:\-]\s*(.*)/i)){out.out+=(out.out?'\n':'')+r[1];n++}
else if(r=l.match(/^(?:clarify|clarification|question)\s*[:\-]\s*(.*)/i)){out.clar+=(out.clar?'\n':'')+r[1];n++}
else if(r=l.match(/^(?:#+|\d+[.)])\s*(.+)/)){ag=Object.assign(ROW.ag(),{t:r[1]});m.ag.push(ag);n++}
else{if(!ag){ag=Object.assign(ROW.ag(),{t:'General Discussion'});m.ag.push(ag)}ag.d+=(ag.d?'\n':'')+l.replace(/^[-•*]\s*/,'')}});
m.reviewed=false;m.status='Draft';return n}
// views
const cnt=()=>{const a=allAct(),od=a.filter(x=>est(x.a)=='Overdue').length;return{t:S.m.length,dr:S.m.filter(m=>m.status=='Draft').length,fi:S.m.filter(m=>m.status=='Finalized').length,rv:S.m.filter(m=>m.status=='Awaiting Review').length,out:a.filter(x=>est(x.a)!='Completed').length,od,co:a.filter(x=>x.a.st=='Completed').length}};
const mrow=(m,ex)=>`<tr><td>${ex?`<input type="checkbox" data-sel="${m.id}"${sel[m.id]?' checked':''}>`:''}${m.date}</td><td>${esc(m.title)||'<i>Untitled</i>'}<br><small>${esc(m.subject)}</small></td><td>${esc(m.type)}</td><td>${esc(m.ref)}</td><td>${esc(m.by)}</td><td>${m.att.length}</td><td>${m.act.length}</td><td><span class="tag ${m.status=='Finalized'?'ok':''}">${m.status}</span></td>${ex?'':`<td><button class="b s" data-open="${m.id}">Edit</button> <button class="b s" data-pv="${m.id}">Preview</button> <button class="b s" data-w="${m.id}">Word</button> <button class="b s" data-dup="${m.id}">Duplicate</button> <button class="b s" data-arc="${m.id}">${m.status=='Archived'?'Unarchive':'Archive'}</button> <button class="b s d" data-del="${m.id}">Delete</button></td>`}</tr>`;
const MH='<th>Date</th><th>Meeting</th><th>Type</th><th>Reference</th><th>Prepared by</th><th>Attendees</th><th>Actions</th><th>Status</th>';
const filt=()=>{const f=$('#fq')?.value.toLowerCase()||q;return S.m.filter(m=>!f||JSON.stringify([m.title,m.subject,m.ref,m.type,m.by,m.projNo]).toLowerCase().includes(f)).sort((a,b)=>b.date.localeCompare(a.date))};
function render(){document.documentElement.classList.toggle('quick',quick);$('#nv').innerHTML=[['dash','Dashboard'],['rec','Meeting Records'],['form','Minutes Form'],['act','Action Items'],['tpl','Templates'],['exp','Export Center'],['set','Settings']].map(t=>`<button data-t="${t[0]}" class="${tab==t[0]?'on':''}">${t[1]}</button>`).join('');
const mn=$('#mn');document.body.className=quick?'quick':'';
if(tab=='dash'){const c=cnt(),up=S.m.filter(m=>m.nd>=today()).sort((a,b)=>a.nd.localeCompare(b.nd)).slice(0,5);mn.innerHTML=`<div class="bar"><button class="b" data-new="1">+ New Meeting Minutes</button></div><div class="kp">${[['Total meetings',c.t],['Drafts',c.dr],['Finalized',c.fi],['Awaiting review',c.rv],['Outstanding actions',c.out],['Overdue actions',c.od],['Completed actions',c.co]].map(x=>`<div><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div><div class="card" style="margin-top:14px"><h3>Recent meetings</h3><div class="sc"><table class="t"><tr>${MH}<th></th></tr>${filt().slice(0,5).map(m=>mrow(m)).join('')||'<tr><td colspan="9">No meetings yet. Create your first one.</td></tr>'}</table></div></div><div class="card"><h3>Upcoming meetings</h3>${up.map(m=>`<p>${dt(m.nd)} ${esc(m.nt)} — ${esc(m.nl)} <small>(from ${esc(m.title)})</small></p>`).join('')||'<p>None scheduled. Set a next meeting date in a minutes form.</p>'}</div>`}
else if(tab=='rec'){mn.innerHTML=`<div class="bar"><input id="fq" placeholder="Search records…" value="${esc(q)}"><button class="b" data-new="1">+ New</button></div><div class="card sc"><table class="t"><tr>${MH}<th></th></tr>${filt().map(m=>mrow(m)).join('')||'<tr><td colspan="9">No matching records.</td></tr>'}</table></div>`}
else if(tab=='form'){if(!cur){mn.innerHTML='<div class="card">Open a record or <button class="b" data-new="1">start a new one</button>.</div>';return}
mn.innerHTML=`<div class="bar"><button class="b s" data-quick="1">${quick?'Switch to Full Detailed Mode':'Switch to Quick Minutes Mode'}</button><button class="b s" data-prevmtg="1">Copy attendees from previous meeting</button><button class="b s" data-pv="${cur.id}">Preview</button><button class="b s" data-w="${cur.id}">Word</button><button class="b s" data-savetpl="1">Save as template</button><button class="b s d" data-del="${cur.id}">Delete this meeting</button></div>
<details open><summary>A. Meeting Information</summary><div><div class="g">${F('title','Meeting title')}${F('subject','Project name / subject')}${F('projNo','Project number','text',0,'opt')}${F('type','Meeting type','sel',TYPES)}${F('ref','Reference number','text',0,'opt')}${F('date','Meeting date','date')}${F('start','Start time','time')}${F('end','End time','time')}${F('loc','Location')}${F('fmt','Format','sel',FMT)}${F('chair','Chair / facilitator')}${F('by','Minutes prepared by')}${F('rev','Minutes reviewed by','text',0,'opt')}${F('dist','Distribution date','date',0,'opt')}${F('nd','Next meeting date','date')}${F('nt','Next meeting time','time')}${F('nl','Next meeting location')}</div></div></details>
<details open><summary>Quick Notes → Formal Minutes</summary><div><label>Paste rough notes. Use “1. Topic”, “Action: … @Name by 2026-12-01”, “Decision: …”, “Issue: …”. Nothing is invented; gaps are marked for review.<textarea id="qn" rows="5">${esc(cur.notes)}</textarea></label><p><button class="b" data-conv="1">Convert Quick Notes to Meeting Minutes</button></p></div></details>
<details open><summary>B. Attendance and Distribution</summary><div>${LST('att','Attendees')}<p><button class="b s" data-saveppl="1">Save attendees to list</button> <button class="b s" data-loadppl="1">Load saved list</button> <button class="b s" data-dist="1">Copy distribution emails</button></p></div></details>
<details open><summary>C. Agenda and Discussion</summary><div>${LST('ag','Agenda items')}</div></details>
<details open><summary>D. Decisions and Resolutions</summary><div>${LST('dec','Decisions')}</div></details>
<details open><summary>E. Action Items</summary><div>${LST('act','Action items')}</div></details>
<details open><summary>F. Issues and Follow-Up</summary><div class="g">${F('iss.out','Outstanding issues','ta',0,'w')}${F('iss.clar','Items requiring clarification','ta',0,'w')}${F('iss.appr','Pending approvals','ta',0,'w')}${F('iss.risk','Risks and concerns','ta',0,'w')}${F('iss.fol','Follow-up requirements','ta',0,'w')}${F('iss.nag','Next meeting agenda','ta',0,'w')}</div></details>
<div class="card"><div class="g">${F('status','Status','sel',['Draft','Awaiting Review','Finalized','Archived'])}<label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" data-rev="1" style="width:auto"${cur.reviewed?' checked':''}> I have reviewed and approve this content (required to finalize)</label></div></div>`}
else if(tab=='act'){const f=$('#as')?.value||'All',a=allAct().filter(x=>f=='All'||est(x.a)==f);mn.innerHTML=`<div class="bar"><select id="as">${['All',...AST].map(x=>`<option${x==f?' selected':''}>${x}</option>`).join('')}</select></div><div class="card sc"><table class="t"><tr><th>Action</th><th>Responsible</th><th>Due</th><th>Priority</th><th>Status</th><th>Meeting</th></tr>${a.map(x=>`<tr><td>${esc(x.a.d)}</td><td>${esc(x.a.who)}</td><td>${x.a.due||'—'}</td><td>${x.a.pri}</td><td><span class="tag ${est(x.a)=='Overdue'?'wr':est(x.a)=='Completed'?'ok':''}">${est(x.a)}</span></td><td><a href="#" data-open="${x.m.id}">${esc(x.m.title)||x.m.ref}</a></td></tr>`).join('')||'<tr><td colspan="6">No action items.</td></tr>'}</table></div>`}
else if(tab=='tpl'){mn.innerHTML=`<div class="card"><h3>Templates</h3><p>Save any meeting as a template from the form. Templates keep meeting type, attendees, agenda topics and next-meeting defaults.</p>${S.tpl.map((t,i)=>`<p><b>${esc(t.name)}</b> <button class="b s" data-usetpl="${i}">New from template</button> <button class="b s d" data-deltpl="${i}">Delete</button></p>`).join('')||'<p>No templates yet.</p>'}</div>`}
else if(tab=='exp'){mn.innerHTML=`<div class="card"><h3>Batch Export Center</h3><div class="bar"><input id="fq" placeholder="Filter by project, title, reference…" value="${esc(q)}"><select id="ft"><option value="">All types</option>${TYPES.map(x=>`<option>${x}</option>`).join('')}</select><input type="date" id="f1"><input type="date" id="f2"><button class="b s" data-all="1">Select all shown</button></div>
<div class="sc"><table class="t"><tr>${MH}</tr>${expList().map(m=>mrow(m,1)).join('')||'<tr><td colspan="8">No records.</td></tr>'}</table></div><p><button class="b" data-bpdf="1">Combined PDF (print)</button> <button class="b" data-bzip="1">Word files as ZIP</button> <button class="b s" data-bone="1">Combined Word file</button> <button class="b s d" data-bdel="1">Delete selected</button></p><small>File names follow the pattern in Settings. Duplicate names inside a ZIP get a numeric suffix so nothing is overwritten.</small></div>`}
else mn.innerHTML=`<div class="card"><h3>Document settings</h3><div class="g"><label>Document title<input data-s="title" value="${esc(S.set.title)}"></label><label>File name pattern<input data-s="name" value="${esc(S.set.name)}"></label><label class="w">Header / letterhead text<textarea data-s="hdr" rows="3">${esc(S.set.hdr)}</textarea></label><label class="w">Footer text<input data-s="ftr" value="${esc(S.set.ftr)}"></label></div><small>Tokens: {project} {title} {date} {ref}</small></div><div class="card"><h3>Local backup</h3><p>All data stays in this browser. Download a backup to move it elsewhere.</p><button class="b" data-bk="1">Download backup (.json)</button> <label style="display:inline-flex">Restore backup<input type="file" accept=".json" id="rs"></label></div>${storCard()}<div class="card"><button class="b s" data-theme="1">Toggle light / dark</button></div>`}
const expList=()=>{const t=$('#ft')?.value,a=$('#f1')?.value,b=$('#f2')?.value;return filt().filter(m=>(!t||m.type==t)&&(!a||m.date>=a)&&(!b||m.date<=b))};
const find=id=>S.m.find(m=>m.id==id),go=t=>{tab=t;render()},openM=id=>{cur=find(id);go('form')};
const chosen=()=>S.m.filter(m=>sel[m.id]);
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.p){sp(cur,t.dataset.p,t.type=='checkbox'?t.checked:t.value);save()}else if(t.dataset.s){S.set[t.dataset.s]=t.value;save()}else if(t.id=='qn'){cur.notes=t.value;save()}else if(t.dataset.sel){sel[t.dataset.sel]=t.checked}else if(t.dataset.rev){cur.reviewed=t.checked;save()}
else if(t.id=='fq'){q=t.value;const p=t.selectionStart;render();const n=$('#fq');n.focus();n.setSelectionRange(p,p)}else if(['as','ft','f1','f2'].includes(t.id)){const v={ft:t.value,f1:t.value,f2:t.value}[t.id];const keep={as:$('#as')?.value,ft:$('#ft')?.value,f1:$('#f1')?.value,f2:$('#f2')?.value};render();for(const k in keep)if(keep[k]!=null&&$('#'+k))$('#'+k).value=keep[k]}
else if(t.id=='rs'&&t.files[0]){t.files[0].text().then(x=>{try{if(x.length>8e6)throw 0;const d=JSON.parse(x);if(!Array.isArray(d.m))throw 0;if(!confirm('Replace current data with this backup?'))return;S=Object.assign(S,clean(d));save();cur=null;go('dash');msg('Backup restored')}catch(e){msg('That file is not a valid backup')}})}});
document.addEventListener('change',e=>{if(e.target.dataset.p=='status'||e.target.dataset.p=='status'){if(cur.status=='Finalized'&&!cur.reviewed){cur.status='Awaiting Review';msg('Tick the review approval box before finalizing.');save();render()}}});
document.addEventListener('click',async e=>{const t=e.target.closest('button,a');if(!t)return;const d=t.dataset;if(t.tagName=='A')e.preventDefault();
if(d.t)go(d.t);else if(d.new){cur=blank();S.m.push(cur);save();go('form')}
else if(d.open)openM(d.open);else if(d.pv){prev([find(d.pv)||cur])}else if(d.w)one(find(d.w)||cur);
else if(d.dup){const c=JSON.parse(JSON.stringify(find(d.dup)));c.id=blank().id;c.ref=blank().ref;c.title+=' (copy)';c.status='Draft';c.reviewed=false;S.m.push(c);save();render()}
else if(d.del){const m=find(d.del);if(m&&confirm('Permanently delete “'+(m.title||m.ref)+'”? This cannot be undone. Download a backup first if unsure.')){S.m=S.m.filter(x=>x!=m);delete sel[m.id];if(cur==m)cur=null;save();if(tab=='form')tab='rec';render();msg('Meeting deleted')}}
else if(d.bdel){const c=chosen();if(!c.length)return msg('Select at least one meeting');if(confirm('Permanently delete '+c.length+' meeting(s)? This cannot be undone.')){S.m=S.m.filter(x=>!sel[x.id]);sel={};if(cur&&!find(cur.id))cur=null;save();render();msg(c.length+' deleted')}}
else if(d.delarc){const n=S.m.filter(m=>m.status=='Archived');if(!n.length)return msg('No archived meetings');if(confirm('Permanently delete '+n.length+' archived meeting(s)?')){S.m=S.m.filter(m=>m.status!='Archived');if(cur&&!find(cur.id))cur=null;save();render()}}
else if(d.arc){const m=find(d.arc);m.status=m.status=='Archived'?'Draft':'Archived';save();render()}
else if(d.add){cur[d.add].push(ROW[d.add]());save();render()}
else if(d.rm){const[k,i]=d.rm.split('.');cur[k].splice(+i,1);save();render()}
else if(d.quick){quick=!quick;render()}
else if(d.conv){const n=parseNotes($('#qn').value);cur.notes=$('#qn').value;save();render();msg(n+' items generated. Review everything, especially fields marked [Responsible TBC], then tick the approval box.')}
else if(d.prevmtg){const p=S.m.filter(m=>m!=cur&&m.att.length).sort((a,b)=>b.date.localeCompare(a.date))[0];if(!p)return msg('No earlier meeting with attendees');cur.att=JSON.parse(JSON.stringify(p.att)).map(a=>({...a,s:'Present'}));save();render()}
else if(d.saveppl){S.ppl=JSON.parse(JSON.stringify(cur.att));save();msg('Attendee list saved')}
else if(d.loadppl){if(!S.ppl.length)return msg('No saved list');cur.att=JSON.parse(JSON.stringify(S.ppl));save();render()}
else if(d.dist){const e=cur.att.map(a=>a.e).filter(Boolean).join('; ');try{await navigator.clipboard.writeText(e);msg('Copied '+(e?e.split(';').length:0)+' emails')}catch(x){msg(e||'No emails entered')}}
else if(d.savetpl){const n=prompt('Template name',cur.title||cur.type);if(!n)return;const c=JSON.parse(JSON.stringify(cur));c.name=n;c.act=[];c.dec=[];c.ag=c.ag.map(a=>({...ROW.ag(),t:a.t}));S.tpl.push({name:n,m:c});save();msg('Template saved')}
else if(d.usetpl){const c=JSON.parse(JSON.stringify(S.tpl[+d.usetpl].m)),b=blank();Object.assign(c,{id:b.id,ref:b.ref,date:today(),status:'Draft',reviewed:false,notes:''});c.title='';S.m.push(c);cur=c;save();go('form')}
else if(d.deltpl){if(confirm('Delete this template?')){S.tpl.splice(+d.deltpl,1);save();render()}}
else if(d.all){expList().forEach(m=>sel[m.id]=true);render()}
else if(d.bpdf){const c=chosen();if(!c.length)return msg('Select at least one meeting');prev(c)}
else if(d.bone){const c=chosen();if(!c.length)return msg('Select at least one meeting');out('MeetingMinutes_Combined.docx',await docx(c))}
else if(d.bzip){const c=chosen();if(!c.length)return msg('Select at least one meeting');const z=new JSZip(),u={};for(const m of c){let n=fname(m,'.docx');if(u[n]){u[n]++;n=n.replace('.docx','_'+u[n]+'.docx')}else u[n]=1;z.file(n,await docx([m]))}out('MeetingMinutes_Batch_'+today()+'.zip',await z.generateAsync({type:'blob'}))}
else if(d.bk){out('MeetingMinutes_Backup_'+today()+'.json',new Blob([JSON.stringify(S)],{type:'application/json'}))}
else if(d.theme){const r=document.documentElement,dk=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dk?'light':'dark'}});
const CAP=5242880;
function used(){let n=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);n+=k.length+(localStorage.getItem(k)||'').length}}catch(e){}return n}
const kb=n=>n>1048576?(n/1048576).toFixed(2)+' MB':Math.round(n/1024)+' KB';
function usage(){const u=used(),p=Math.min(100,u/CAP*100),e=$('#st');if(e){e.textContent=' · Storage: '+kb(u)+' used, ~'+kb(Math.max(0,CAP-u))+' left ('+p.toFixed(0)+'%)';e.style.color=p>80?'var(--wr)':'var(--mu)'}}
function storCard(){const u=used(),p=Math.min(100,u/CAP*100),big=S.m.map(m=>[m,JSON.stringify(m).length]).sort((a,b)=>b[1]-a[1]).slice(0,8);return `<div class="card"><h3>Storage</h3><div style="height:10px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;overflow:hidden"><div style="height:100%;width:${p}%;background:${p>80?'var(--wr)':'var(--ac)'}"></div></div><p>${kb(u)} used of about ${kb(CAP)} browser limit (${p.toFixed(1)}%), roughly ${kb(Math.max(0,CAP-u))} free. The real limit varies by browser; this is a conservative estimate.</p>${p>80?'<p class="tag wr">Storage is nearly full. Download a backup, then delete old meetings.</p>':''}<h3>Largest records</h3>${big.map(x=>`<p>${esc(x[0].title||x[0].ref)} <small>(${x[0].date}, ${kb(x[1])})</small> <button class="b s d" data-del="${x[0].id}">Delete</button></p>`).join('')||'<p>No records.</p>'}<p><button class="b s d" data-delarc="1">Delete all archived</button></p></div>`}
const cs=v=>String(v??'').slice(0,20000).replace(/<\s*\/?\s*script/gi,'');
function clean(d){const row=(k,x)=>{const t=ROW[k](),y={};for(const f in t)y[f]=cs(x&&x[f]);return y};const cm=m=>{m=m||{};const b=blank(),r={};for(const k in b){if(Array.isArray(b[k]))r[k]=(Array.isArray(m[k])?m[k]:[]).slice(0,2000).map(x=>row(k,x));else if(typeof b[k]=='object')r[k]=Object.fromEntries(Object.keys(b[k]).map(f=>[f,cs(m[k]&&m[k][f])]));else if(typeof b[k]=='boolean')r[k]=!!m[k];else r[k]=cs(m[k])}r.id=/^m\w+$/.test(m.id||'')?m.id:b.id;return r};const o={m:d.m.slice(0,5000).map(cm),tpl:(Array.isArray(d.tpl)?d.tpl:[]).slice(0,100).map(t=>({name:cs(t&&t.name),m:cm(t&&t.m)})),ppl:(Array.isArray(d.ppl)?d.ppl:[]).slice(0,500).map(x=>row('att',x)),set:{...S.set}};for(const k of ['title','hdr','ftr','name'])if(d.set&&typeof d.set[k]=='string')o.set[k]=cs(d.set[k]);return o}
render();usage();
</script></body></html>
